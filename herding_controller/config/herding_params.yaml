herding_controller:
  ros__parameters:
    frame_id: "map"
    control_rate_hz: 5.0

    # --- Capture Zone ---
    capture_zone_x_m: 3.0
    capture_zone_y_m: 3.0
    capture_radius_m: 0.5
    capture_hold_sec: 3.0

    # --- Grid ---
    grid_resolution_m: 0.25
    grid_width_cells: 40
    grid_height_cells: 40

    # --- Target Estimator (KF) ---
    kf_process_noise: 0.1
    kf_measurement_noise: 0.05
    occlusion_timeout_sec: 3.0

    # --- Escape Model (Markov) ---
    markov_wall_follow_p: 0.70
    markov_wall_hug_p: 0.20
    markov_center_p: 0.10
    momentum_weight: 0.4
    robot_repulsion_weight: 1.5
    wall_detect_radius_cells: 1
    escape_route_top_k: 3
    # Max escape-direction probability at or above which the distribution counts as
    # "concentrated", gating the HERD->CORNER transition (and the CORNER->HERD fallback).
    escape_concentration_threshold: 0.5

    # --- Herding Control ---
    # Task 15 tuning. Two hard geometric constraints drive these values:
    #   (1) drive_distance_m * drive_distance_ease_factor MUST stay below
    #       flee_reaction_distance_m. The Driver converges onto its driving point and
    #       stops there; if that point sits outside the target's reaction radius the
    #       target never flees and the whole system deadlocks with zero progress.
    #       0.75 * 1.15 = 0.86 < 1.0 leaves ~14% margin. (Measured: at an eased
    #       distance of 1.05 the reactive_flee success rate collapses to 2.5%.)
    #   (2) drive_distance_m must exceed panic_distance_m by enough that normal
    #       tracking overshoot does not trip the panic retreat. 0.75 vs 0.35 measured
    #       a 5% panic rate; dropping to 0.4 pushed it to 62%.
    # 0.75 sits mid-plateau (0.70/0.75/0.80 all score 80-87%), so it is a robust
    # choice rather than a sweep maximum.
    drive_distance_m: 0.75
    flee_reaction_distance_m: 1.0
    panic_distance_m: 0.35
    alignment_threshold: 0.7
    drive_distance_ease_factor: 1.15
    # Raised 1.2 -> 3.0: this was by far the most sensitive parameter measured.
    # At 1.2 the Blocker parked just outside the target's 1.0 m reaction radius and
    # directly on the target's anti-goal escape bearing -- close enough to distort the
    # flee vector away from the goal, too far to apply useful pressure. Flanking wide
    # keeps the Blocker cutting off the escape corridor without polluting the Driver's
    # push. Measured on reactive_flee: 1.2 -> 25%, 2.0 -> 62%, 3.0 -> 82%. Beyond ~6 m
    # every candidate bearing leaves the 10x10 m grid, compute_blocking_point falls
    # through to target_pos, and the Blocker rams the target (12.0 -> 82% panic rate),
    # so 3.0 is an interior optimum, not a "disable the Blocker" degenerate value.
    # NOTE: 3.0 m is scaled to the 10 x 10 m validation arena. Re-tune for a smaller
    # field -- roughly a third of the arena's shorter side.
    block_lookahead_m: 3.0

    # --- Role Assignment ---
    role_swap_margin: 0.5
    role_swap_cooldown_sec: 2.0
    min_robot_separation_m: 0.6
    role_cost_turn_weight: 0.3

    # --- Occlusion Grid ---
    diffusion_rate: 0.2
    decay_factor: 0.9
