<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Detection DB</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
<header class="topbar"><div class="brand"><span class="brand-dot"></span><div><strong>WPC Control</strong><small>Detection Database</small></div></div><div class="top-actions"><a class="text-link" href="{{ url_for('dashboard') }}">← 관제 화면</a><span class="user-chip">{{ user.username }}</span></div></header>
<main class="shell">
  <section class="page-heading"><div><p class="eyebrow">EVIDENCE DATABASE</p><h1>탐지 및 방제 기록</h1><p class="muted">쥐·쥐구멍·배설물 탐지 결과를 검색하고 검토 상태를 관리합니다.</p></div></section>
  <section class="panel database-panel">
    <form id="filter-form" class="filters">
      <input name="robot_id" placeholder="로봇 ID">
      <select name="object_type"><option value="">전체 객체</option><option value="LIVE_RODENT">쥐</option><option value="ENTRY_POINT">쥐구멍</option><option value="DROPPINGS">배설물</option></select>
      <select name="review_status"><option value="">전체 상태</option><option value="UNREVIEWED">미검토</option><option value="REVIEWED">검토 완료</option><option value="ACTIONED">조치 완료</option><option value="FALSE_POSITIVE">오탐</option></select>
      <label class="date-filter">시작일<input type="date" name="date_from"></label>
      <label class="date-filter">종료일<input type="date" name="date_to"></label>
      <button class="primary-button">검색</button>
    </form>
    <div class="table-wrap"><table><thead><tr><th>ID</th><th>시간</th><th>로봇</th><th>객체</th><th>신뢰도</th><th>거리</th><th>좌표</th><th>소스</th><th>검토 상태</th><th>메모</th><th>저장</th></tr></thead><tbody id="detection-tbody"></tbody></table></div>
    <div class="pagination"><span id="page-summary">—</span><div><button id="prev-page" class="table-button" type="button">이전</button><button id="next-page" class="table-button" type="button">다음</button></div></div>
  </section>
</main>
<div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
<script src="{{ url_for('static', filename='js/detections.js') }}"></script>
</body>
</html>
